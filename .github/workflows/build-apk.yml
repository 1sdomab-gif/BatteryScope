name: Build BatteryScope APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project archive
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP archive was not found."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT_FILE="$(find source -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project in $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryScope-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
